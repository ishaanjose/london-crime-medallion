version: 2

models:
  - name: int_mhclg__imd_2019_lsoa21
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - measure
      - dbt_utils.expression_is_true:
          arguments:
            expression: "decile between 1 and 10"
    columns:
      - name: decile
        data_tests:
          - not_null
  - name: stg_ons__lsoa_lookup
    columns:
      - name: change_indicator
        data_tests:
          - accepted_values:
              arguments:
                values: ['U', 'S', 'M', 'X']
