version: 2

models:
  - name: transport__stations
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_in_london or lsoa21_code is not null"
    columns:
      - name: station_key
        data_tests:
          - unique
          - not_null
      - name: network
        data_tests:
          - accepted_values:
              arguments:
                values: ['tfl', 'national_rail']
      - name: latitude
        data_tests:
          - not_null
      - name: longitude
        data_tests:
          - not_null
