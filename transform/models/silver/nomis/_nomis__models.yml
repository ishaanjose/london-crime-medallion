version: 2

models:
  - name: nomis__lsoa21_population
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - mid_year
      - dbt_utils.expression_is_true:
          arguments:
            expression: "population > 0"
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ons__london_lsoa21')
                field: lsoa21_code
      - name: mid_year
        data_tests:
          - not_null
      - name: population
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
