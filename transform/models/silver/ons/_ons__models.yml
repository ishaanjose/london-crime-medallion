version: 2

models:
  - name: ons__london_lsoa21
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: borough_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('london_boroughs')
                field: borough_code
      - name: geometry
        data_tests:
          - not_null
