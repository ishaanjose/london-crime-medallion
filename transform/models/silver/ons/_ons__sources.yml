version: 2

sources:
  - name: ons_geography
    tables:
      - name: lsoa_lookup
        meta:
          external_location: "read_parquet('../data/bronze/ons_geography/lsoa_lookup/*/*.parquet', hive_partitioning = true)"
      - name: lsoa21_boundaries
        meta:
          # Keep this above the current ~84 MB FeatureCollection size.
          external_location: "read_json('../data/bronze/ons_geography/lsoa21_boundaries/*/*.geojson', format = 'unstructured', maximum_object_size = 500000000, hive_partitioning = true)"
