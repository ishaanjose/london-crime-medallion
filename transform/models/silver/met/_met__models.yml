version: 2

models:
  - name: int_met__lsoa_crime_counts_deduped
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa_code
              - ho_minor_category
              - month
    columns:
      - name: lsoa_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: ho_major_category
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
      - name: source_release
        data_tests:
          - not_null
