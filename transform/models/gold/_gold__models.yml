version: 2

seeds:
  - name: known_data_breaks
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - crime_group
  - name: duplicated_source_months
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - force
              - crime_type
  - name: known_outcome_gaps
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - force
              - start_month
    columns:
      - name: severity
        description: degraded and collapsed make charge rates unreliable; step only silences the outcome collapse test.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - degraded
                  - collapsed
                  - step
  - name: known_source_changes
    description: Changes to the sources themselves; an empty end_month means still in effect.
    config:
      column_types:
        start_month: date
        end_month: date
    columns:
      - name: source
        data_tests:
          - not_null
      - name: change_type
        data_tests:
          - not_null
      - name: handling
        data_tests:
          - not_null
  - name: known_crime_gaps
    description: Known coverage gaps where police.uk undercounts relative to the Met datastore; an empty end_month means the gap is still in effect.
    config:
      column_types:
        start_month: date
        end_month: date
    columns:
      - name: force
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('police_uk_crime_type_map')
                field: crime_group
      - name: start_month
        data_tests:
          - not_null
      - name: reason
        data_tests:
          - not_null

  - name: london_boroughs
    columns:
      - name: borough_code
        data_tests:
          - unique
          - not_null
      - name: borough_name
        data_tests:
          - unique
          - not_null

models:
  - name: fct_police_uk_crimes_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: fct_met_crimes_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: rpt_crime_reconciliation
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: police_uk_count
        data_tests:
          - not_null
      - name: met_count
        data_tests:
          - not_null
  - name: fct_police_uk_crimes_lsoa_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - month
              - crime_group
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: fct_met_crimes_lsoa_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - month
              - crime_group
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null

  - name: dim_lsoa
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('ons__london_lsoa21')
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: lsoa21_name
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: area_km2
        data_tests:
          - not_null
      - name: centroid_lat
        data_tests:
          - not_null
      - name: centroid_lon
        data_tests:
          - not_null
      - name: imd_decile_2019
        data_tests:
          - not_null
      - name: imd_decile_2025
        data_tests:
          - not_null
      - name: imd_rank_2025
        data_tests:
          - not_null
      - name: income_decile_2019
        data_tests:
          - not_null
      - name: income_decile_2025
        data_tests:
          - not_null
      - name: employment_decile_2019
        data_tests:
          - not_null
      - name: employment_decile_2025
        data_tests:
          - not_null
      - name: imd_2019_mapping_method
        data_tests:
          - not_null
      - name: nearest_station_m
        data_tests:
          - not_null
      - name: nearest_station_name
        data_tests:
          - not_null
      - name: nearest_station_key
        data_tests:
          - not_null
      - name: nearest_station_network
        data_tests:
          - not_null
      - name: stations_within_1km
        data_tests:
          - not_null
      - name: nearest_park_entrance_m
        data_tests:
          - not_null
      - name: nearest_park_site_id
        data_tests:
          - not_null
      - name: nearest_park_name
        description: Null when the nearest park has no name in OS Open Greenspace.
      - name: park_ha_within_1km
        data_tests:
          - not_null

  - name: fct_police_uk_lsoa_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - month
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
      - name: asb_count
        data_tests:
          - not_null
      - name: population
        data_tests:
          - not_null
      - name: population_year
        data_tests:
          - not_null
      - name: population_is_estimated_year
        data_tests:
          - not_null
      - name: crimes_per_1000
        data_tests:
          - not_null
      - name: is_low_population
        data_tests:
          - not_null

  - name: fct_police_uk_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
      - name: asb_count
        data_tests:
          - not_null
      - name: population
        data_tests:
          - not_null
      - name: crimes_per_1000
        data_tests:
          - not_null
      - name: crime_count_12m
        description: Trailing 12-month crime count; null for each borough's first 11 months.
      - name: crimes_per_1000_12m
        description: >
          Trailing 12-month crimes per 1,000 residents; null for each borough's first 11 months.
          Excludes anti-social behaviour but includes crime groups with a registered police.uk
          coverage gap, so it can differ from the published headline while a gap is open.

  - name: fct_police_uk_london_month
    columns:
      - name: month
        data_tests:
          - unique
          - not_null
      - name: crimes_per_1000_12m
        description: >
          Trailing 12-month crimes per 1,000 residents; null for the first 11 months.
          Excludes anti-social behaviour but includes crime groups with a registered police.uk
          coverage gap, so it can differ from the published headline while a gap is open.

  - name: fct_police_uk_charge_rates
    description: >
      Charged within 12 months of the crime, by borough, crime month, crime group and force. Show
      charge_rate_12m only where is_mature; grey it out with the known_outcome_gaps reason where
      is_outcome_data_impaired.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - crime_month
              - crime_group
              - force
      - dbt_utils.expression_is_true:
          arguments:
            expression: "charged_within_12m <= charged_ever and charged_ever <= crimes"
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: crime_month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: force
        description: Police force that recorded the crime; City of London Police and the Met both record crimes inside the City.
        data_tests:
          - not_null
      - name: crimes
        data_tests:
          - not_null
      - name: charged_within_12m
        data_tests:
          - not_null
      - name: charged_ever
        data_tests:
          - not_null
      - name: is_outcome_data_impaired
        data_tests:
          - not_null
      - name: is_mature
        data_tests:
          - not_null
      - name: charge_rate_12m
        description: Null until the crime month has had a full 12 months of outcome data.

  - name: fct_police_uk_outcome_mix
    description: >
      Crimes by final police-stage outcome, by borough, crime month, crime group and force. Same
      is_mature and is_outcome_data_impaired rules as fct_police_uk_charge_rates.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - crime_month
              - crime_group
              - force
              - final_outcome_group
    columns:
      - name: force
        data_tests:
          - not_null
      - name: final_outcome_group
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Charged
                  - Out-of-court resolution
                  - Unable to prosecute
                  - Not in public interest
                  - Passed to another organisation
                  - No suspect identified
                  - No outcome recorded

  - name: dim_map_point
    description: >
      One row per police.uk anonymised map point. point_id is a dense rank, stable only within
      one build; it always rebuilds together with fct_police_uk_point_month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - longitude
              - latitude
    columns:
      - name: point_id
        data_tests:
          - unique
          - not_null
      - name: lsoa21_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_lsoa')
                field: lsoa21_code

  - name: dim_postcode
    columns:
      - name: postcode_key
        data_tests:
          - unique
          - not_null
      - name: lsoa21_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_lsoa')
                field: lsoa21_code

  - name: geo_lsoa
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_lsoa')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ST_IsValid(geometry)"
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null

  - name: geo_borough
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ST_IsValid(geometry)"
    columns:
      - name: borough_code
        data_tests:
          - unique
          - not_null

  - name: fct_police_uk_point_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - point_id
              - month
              - crime_group
    columns:
      - name: point_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_map_point')
                field: point_id

  - name: rpt_crime_concentration
    description: >
      Lorenz curve of crime across places, per full calendar year and place level, excluding
      anti-social behaviour and crime groups with a registered police.uk coverage gap (currently
      criminal damage and arson, dropped from every year so the series stays like-for-like): the
      top pct_places percent of places hold pct_crime percent of crime.
      point is police.uk anonymised map points, roughly street segments; it only includes points
      with at least one crime that year, because police.uk never publishes empty points, so it
      understates concentration. lsoa covers all 4,994 LSOAs, zero-crime ones included. The
      point curve skips 2011 and 2022: police.uk replaced its anonymous map-point set from Dec
      2011 and Jul 2022, so in those years one street counts as two places and point-level
      concentration isn't comparable. Their lsoa rows are kept.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - place_level
              - pct_places
    columns:
      - name: place_level
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - point
                  - lsoa
      - name: pct_crime
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: rpt_crime_concentration_summary
    description: >
      One row per full year and place level. pct_places_for_half_of_crime is the smallest
      percentage of places holding half of crime; gini is 0 when crime is spread evenly and 1 when
      it is all in one place. Same exclusions as rpt_crime_concentration (anti-social behaviour
      and coverage gap groups, currently criminal damage and arson) and the same point-level
      caveat. No point rows for 2011 and 2022: police.uk replaced its anonymous map-point set from
      Dec 2011 and Jul 2022, so in those years one street counts as two places and point-level
      concentration isn't comparable. Their lsoa rows are kept.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - place_level
    columns:
      - name: gini
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_source_freshness
    description: >
      Latest ingest per source and dataset. data_from and data_to are the months the crime data
      covers; null for reference sources. Age since ingest is computed by the dashboard on load,
      not here, because now() in a table freezes at build time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source
              - dataset

  - name: rpt_known_issues
    description: >
      Every known data break, duplicate publication, outcome gap and source change as one
      timeline. start_month is null for issues with no start date (TfL station coverage); a null
      end_month means still in effect.
    columns:
      - name: issue_type
        data_tests:
          - not_null
      - name: source
        data_tests:
          - not_null
      - name: description
        data_tests:
          - not_null
      - name: handling
        data_tests:
          - not_null
  - name: metricflow_time_spine
    description: Daily calendar for MetricFlow time-based metrics.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - unique
          - not_null
