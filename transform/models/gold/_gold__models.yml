version: 2

seeds:
  - name: london_boroughs
    columns:
      - name: borough_code
        data_tests:
          - unique
          - not_null
      - name: borough_name
        data_tests:
          - unique
          - not_null

models:
  - name: fct_police_uk_crimes_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: fct_met_crimes_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
