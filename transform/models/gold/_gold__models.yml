version: 2

seeds:
  - name: known_data_breaks
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - crime_group
  - name: duplicated_source_months
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - force
              - crime_type
  - name: known_outcome_gaps
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - force
              - start_month
  - name: london_boroughs
    columns:
      - name: borough_code
        data_tests:
          - unique
          - not_null
      - name: borough_name
        data_tests:
          - unique
          - not_null

models:
  - name: fct_police_uk_crimes_borough_month
