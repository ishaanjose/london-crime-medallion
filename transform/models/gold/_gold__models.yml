version: 2

seeds:
  - name: known_data_breaks
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - crime_group
  - name: duplicated_source_months
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - force
              - crime_type
  - name: known_outcome_gaps
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - force
              - start_month
    columns:
      - name: severity
        description: degraded and collapsed make charge rates unreliable; step only silences the outcome collapse test.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - degraded
                  - collapsed
                  - step
  - name: london_boroughs
    columns:
      - name: borough_code
        data_tests:
          - unique
          - not_null
      - name: borough_name
        data_tests:
          - unique
          - not_null

models:
  - name: fct_police_uk_crimes_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: fct_met_crimes_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: rpt_crime_reconciliation
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
              - crime_group
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: police_uk_count
        data_tests:
          - not_null
      - name: met_count
        data_tests:
          - not_null
  - name: fct_police_uk_crimes_lsoa_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - month
              - crime_group
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
  - name: fct_met_crimes_lsoa_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - month
              - crime_group
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null

  - name: dim_lsoa
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('ons__london_lsoa21')
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: lsoa21_name
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: area_km2
        data_tests:
          - not_null
      - name: centroid_lat
        data_tests:
          - not_null
      - name: centroid_lon
        data_tests:
          - not_null
      - name: imd_decile_2019
        data_tests:
          - not_null
      - name: imd_decile_2025
        data_tests:
          - not_null
      - name: imd_rank_2025
        data_tests:
          - not_null
      - name: income_decile_2019
        data_tests:
          - not_null
      - name: income_decile_2025
        data_tests:
          - not_null
      - name: employment_decile_2019
        data_tests:
          - not_null
      - name: employment_decile_2025
        data_tests:
          - not_null
      - name: imd_2019_mapping_method
        data_tests:
          - not_null
      - name: nearest_station_m
        data_tests:
          - not_null
      - name: nearest_station_name
        data_tests:
          - not_null
      - name: nearest_station_key
        data_tests:
          - not_null
      - name: nearest_station_network
        data_tests:
          - not_null
      - name: stations_within_1km
        data_tests:
          - not_null
      - name: nearest_park_entrance_m
        data_tests:
          - not_null
      - name: nearest_park_site_id
        data_tests:
          - not_null
      - name: nearest_park_name
        description: Null when the nearest park has no name in OS Open Greenspace.
      - name: park_ha_within_1km
        data_tests:
          - not_null

  - name: fct_police_uk_lsoa_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lsoa21_code
              - month
    columns:
      - name: lsoa21_code
        data_tests:
          - not_null
      - name: borough_code
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
      - name: asb_count
        data_tests:
          - not_null
      - name: population
        data_tests:
          - not_null
      - name: population_year
        data_tests:
          - not_null
      - name: population_is_estimated_year
        data_tests:
          - not_null
      - name: crimes_per_1000
        data_tests:
          - not_null
      - name: is_low_population
        data_tests:
          - not_null

  - name: fct_police_uk_borough_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - month
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: crime_count
        data_tests:
          - not_null
      - name: asb_count
        data_tests:
          - not_null
      - name: population
        data_tests:
          - not_null
      - name: crimes_per_1000
        data_tests:
          - not_null
      - name: crime_count_12m
        description: Trailing 12-month crime count; null for each borough's first 11 months.
      - name: crimes_per_1000_12m
        description: Trailing 12-month crimes per 1,000 residents; null for each borough's first 11 months.

  - name: fct_police_uk_london_month
    columns:
      - name: month
        data_tests:
          - unique
          - not_null

  - name: fct_police_uk_charge_rates
    description: >
      Charged within 12 months of the crime, by borough, crime month and crime group. Show
      charge_rate_12m only where is_mature; grey it out with the known_outcome_gaps reason where
      is_outcome_data_impaired.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - crime_month
              - crime_group
      - dbt_utils.expression_is_true:
          arguments:
            expression: "charged_within_12m <= charged_ever and charged_ever <= crimes"
    columns:
      - name: borough_code
        data_tests:
          - not_null
      - name: borough_name
        data_tests:
          - not_null
      - name: crime_month
        data_tests:
          - not_null
      - name: crime_group
        data_tests:
          - not_null
      - name: crimes
        data_tests:
          - not_null
      - name: charged_within_12m
        data_tests:
          - not_null
      - name: charged_ever
        data_tests:
          - not_null
      - name: is_outcome_data_impaired
        data_tests:
          - not_null
      - name: is_mature
        data_tests:
          - not_null
      - name: charge_rate_12m
        description: Null until the crime month has had a full 12 months of outcome data.

  - name: fct_police_uk_outcome_mix
    description: >
      Crimes by final police-stage outcome, by borough, crime month and crime group. Same
      is_mature and is_outcome_data_impaired rules as fct_police_uk_charge_rates.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - borough_code
              - crime_month
              - crime_group
              - final_outcome_group
    columns:
      - name: final_outcome_group
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Charged
                  - Out-of-court resolution
                  - Unable to prosecute
                  - Not in public interest
                  - Passed to another organisation
                  - No suspect identified
                  - No outcome recorded
