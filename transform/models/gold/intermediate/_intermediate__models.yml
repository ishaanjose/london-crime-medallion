version: 2

models:
  - name: int_lsoa__imd_wide
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: imd_decile_2019
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: imd_decile_2025
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: income_decile_2019
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: income_decile_2025
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: employment_decile_2019
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: employment_decile_2025
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10

  - name: int_lsoa__nearest_station
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: nearest_station_m
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10000
      - name: nearest_station_network
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tfl', 'national_rail']
  - name: int_lsoa__park_access
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: nearest_park_entrance_m
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
      - name: park_ha_within_1km
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 314.16
      - name: park_count_within_1km
        description: Distinct park sites intersecting the same 1 km centroid buffer park_ha_within_1km measures.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: int_police_uk__crime_outcomes
    columns:
      - name: crime_id
        data_tests:
          - unique
          - not_null
      - name: months_to_charge
        description: Months from the crime to its first charge; a negative value means the outcome join is wrong.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: force
        data_tests:
          - not_null
      - name: is_outcome_data_impaired
        data_tests:
          - not_null

  - name: int_police_uk__place_year_crimes
    description: >
      Crimes per place per full calendar year, at point and lsoa level. Excludes anti-social
      behaviour and every crime group with a registered police.uk coverage gap (known_crime_gaps;
      currently criminal damage and arson). A gap group is dropped from every year when its gap
      is open or overlaps any full year, so the series stays like-for-like.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - place_level
              - place_id
