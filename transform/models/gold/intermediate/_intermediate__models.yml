version: 2

models:
  - name: int_lsoa__imd_wide
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: imd_decile_2019
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: imd_decile_2025
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: income_decile_2019
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: income_decile_2025
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: employment_decile_2019
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: employment_decile_2025
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10

  - name: int_lsoa__nearest_station
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: nearest_station_m
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10000
      - name: nearest_station_network
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tfl', 'national_rail']
  - name: int_lsoa__park_access
    columns:
      - name: lsoa21_code
        data_tests:
          - unique
          - not_null
      - name: nearest_park_entrance_m
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
      - name: park_ha_within_1km
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 314.16
